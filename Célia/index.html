<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#11162a">
<title>Fermenta! — Desafio da turma</title>
<style>
:root{color-scheme:dark;--bg:#11162a;--panel:#1c233c;--text:#f8f9ff;--muted:#b7bfd7;--lime:#d4fa71;--purple:#b4a0ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid white;outline-offset:5px}button:disabled{cursor:default}header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:24px 4vw;border-bottom:1px solid #343c56}.brand{font-size:26px;font-weight:900;letter-spacing:-1px}.brand span{color:var(--lime)}.tag{color:var(--muted);font-size:14px;letter-spacing:2px;text-transform:uppercase}main{max-width:1400px;margin:auto;padding:28px 4vw 24px}.meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.eyebrow{color:var(--purple);font-weight:700;letter-spacing:2px;font-size:14px;text-transform:uppercase}.steps{display:flex;gap:8px}.step{width:42px;height:5px;background:#384059;border-radius:5px}.step.done{background:var(--lime)}.step.active{background:var(--purple)}h1{font-size:clamp(30px,3.5vw,54px);line-height:1.08;letter-spacing:-1.5px;margin:0 0 14px;max-width:1050px}.intro{color:var(--muted);font-size:clamp(17px,1.5vw,22px);line-height:1.5;margin:0 0 25px}.context{display:flex;gap:14px;margin-bottom:24px}.sample{flex:1;border:1px solid #49526f;border-radius:16px;padding:17px 22px;font-size:clamp(17px,1.7vw,24px);line-height:1.4}.sample b{display:block;color:var(--lime);font-size:14px;letter-spacing:2px;margin-bottom:5px}.sample:last-child b{color:var(--purple)}.options{display:grid;grid-template-columns:1fr 1fr;gap:14px}.option{display:flex;gap:16px;align-items:center;text-align:left;background:var(--panel);color:white;border:2px solid transparent;border-radius:16px;padding:22px;font-size:clamp(20px,2vw,29px);min-height:104px;transition:background .15s,transform .15s}.option:not(:disabled):hover{background:#2b3454;transform:translateY(-2px)}.letter{flex-shrink:0;display:grid;place-items:center;width:44px;height:44px;border:1px solid #5b6583;border-radius:12px;font-size:20px;font-weight:bold}.option.selected{border-color:var(--purple);background:#322b50}.option.correct{border-color:var(--lime);background:#273e30}.option.correct .letter{background:var(--lime);color:var(--bg);border-color:var(--lime)}.option.wrong{border-color:#ffaaa8;background:#442f3c}.feedback{margin-top:20px;padding:20px 24px;border-radius:16px;background:#24362e;font-size:clamp(18px,1.6vw,24px);line-height:1.5}.feedback b{color:var(--lime)}.feedback p{margin:5px 0 0}.bottom{display:flex;justify-content:flex-end;align-items:center;gap:20px;margin-top:26px}.primary{background:var(--lime);color:#142014;font-weight:800;border:0;border-radius:13px;padding:17px 27px;font-size:20px}.primary:disabled{background:#353e50;color:#b0b8cb}.hint{font-size:14px;color:var(--muted);margin-top:20px;line-height:1.5}.end{padding:30px 0}.equation{background:var(--panel);padding:24px;border-radius:18px;margin:25px 0;font-size:clamp(23px,3vw,42px);line-height:1.6}.equation small{display:block;font-size:17px;color:var(--muted);letter-spacing:0}[hidden]{display:none!important}@media(min-width:1500px){main{padding-top:45px}.option{min-height:125px}}@media(max-width:650px){header{padding:18px 5vw}.tag{display:none}main{padding:24px 5vw}.options{grid-template-columns:1fr}.option{padding:16px;min-height:80px}.context{flex-direction:column}.bottom{align-items:stretch;flex-direction:column}.step{width:25px}.sample{padding:14px}.hint{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="brand">fermenta<span>!</span></div><div class="tag">O desafio da turma</div></header>
<main id="app"></main>
<script>
const questions=[
{label:'Observe e aposte',title:'Em qual copo esperamos mais bolhas?',intro:'Mesma água, mesma quantidade de fermento e mesma temperatura. Só uma coisa muda.',context:true,options:['Copo A, com açúcar','Copo B, sem açúcar','Os dois, sempre igualmente','Nenhum dos dois'],answer:0,explain:'As leveduras utilizam o açúcar e podem liberar CO₂ durante a fermentação. Com açúcar adicionado, esperamos mais bolhas no mesmo intervalo. O copo sem açúcar pode ter alguma atividade.'},
{label:'O mistério das bolhas',title:'Qual gás está saindo da mistura?',intro:'A turma observou bolhas. Agora é hora de identificar o que está sendo liberado.',options:['Oxigênio (O₂)','Hidrogênio (H₂)','Gás carbônico (CO₂)','Nitrogênio (N₂)'],answer:2,explain:'Na fermentação alcoólica, as leveduras transformam açúcares em etanol e gás carbônico. O CO₂ forma as bolhas; o etanol permanece na mistura.'},
{label:'Quem faz a transformação?',title:'O fermento biológico é formado por…',intro:'Escolham quem está por trás da transformação do açúcar.',options:['Enzimas do açúcar, sem seres vivos','Leveduras, fungos microscópicos','Bactérias que produzem oxigênio','Pequenos cristais de gás'],answer:1,explain:'As leveduras são fungos unicelulares. Suas enzimas participam das reações que transformam os açúcares, permitindo obter energia durante a fermentação.'},
{label:'Desafio final',title:'Para comparar os copos, o que deve mudar?',intro:'Queremos investigar especificamente o efeito da adição de açúcar.',options:['A temperatura e a quantidade de água','A quantidade de fermento e o tempo','Tudo: quanto mais diferenças, melhor','Apenas a adição de açúcar'],answer:3,explain:'Mudar apenas a adição de açúcar torna a comparação mais justa. Água, fermento, temperatura e tempo devem ser mantidos iguais. O copo sem açúcar adicionado funciona como controle.'}
];
const app=document.getElementById('app');let index=0,selected=null,revealed=false;
function render(){const q=questions[index];app.innerHTML=`<div class="meta"><span class="eyebrow">Rodada ${index+1} / 4 · ${q.label}</span><div class="steps" aria-label="Rodada ${index+1} de 4">${questions.map((_,i)=>`<span class="step ${i<index?'done':i===index?'active':''}"></span>`).join('')}</div></div><h1>${q.title}</h1><p class="intro">${q.intro}</p>${q.context?'<div class="context"><div class="sample"><b>COPO A</b>Água + fermento + açúcar</div><div class="sample"><b>COPO B</b>Água + fermento</div></div>':''}<div class="options">${q.options.map((o,i)=>`<button class="option" data-choice="${i}" aria-pressed="false"><span class="letter">${'ABCD'[i]}</span><span>${o}</span></button>`).join('')}</div><div class="feedback" id="feedback" aria-live="polite" hidden></div><div class="bottom"><button class="primary" id="action" disabled>Revelar resposta</button></div><p class="hint">Levantem a mão para votar em A, B, C ou D. O apresentador marca a mais votada e revela a resposta.</p>`;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.choice)));document.getElementById('action').onclick=advance}
function choose(i){if(revealed||index>=questions.length)return;selected=i;document.querySelectorAll('[data-choice]').forEach((b,j)=>{b.classList.toggle('selected',i===j);b.setAttribute('aria-pressed',String(i===j))});document.getElementById('action').disabled=false}
function advance(){if(index>=questions.length)return;if(!revealed){if(selected===null)return;revealed=true;const q=questions[index],right=selected===q.answer;document.querySelectorAll('[data-choice]').forEach((b,i)=>{b.disabled=true;b.classList.toggle('correct',i===q.answer);b.classList.toggle('wrong',i===selected&&!right)});const f=document.getElementById('feedback');f.hidden=false;f.innerHTML=`<b>${right?'A turma acertou!':'Essa surpreendeu!'} Resposta ${'ABCD'[q.answer]}.</b><p>${q.explain}</p>`;document.getElementById('action').textContent=index===3?'Ver resultado →':'Próxima rodada →'}else{index++;selected=null;revealed=false;if(index===4)finish();else render()}}
function finish(){app.innerHTML=`<section class="end"><div class="eyebrow">Desafio concluído</div><h1>Agora vamos conectar as ideias.</h1><p class="intro">Açúcar disponível, leveduras em ação e gás sendo liberado.</p><div class="equation">C₆H₁₂O₆ → 2 C₂H₅OH + 2 CO₂<small>Glicose → etanol + gás carbônico</small></div><p class="intro">O açúcar de cozinha é a sacarose: antes de fermentar, ela é quebrada em glicose e frutose. O etanol produzido pertence à função álcool.</p><button class="primary" id="restart">Jogar novamente ↻</button></section>`;document.getElementById('restart').onclick=()=>{index=0;selected=null;revealed=false;render()}}
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.repeat)return;if(index<4&&'abcd'.includes(e.key.toLowerCase())&&e.key.length===1)choose('abcd'.indexOf(e.key.toLowerCase()));if(e.key==='ArrowRight'&&index<4&&revealed)advance()});render();
</script>
</body>
</html>
