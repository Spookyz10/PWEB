<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pergunta 5</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <h2 class="maintitle">5/5</h2>
    <div class="title">
      <h2 class="maintitle">
        Em relação à arquitetura cliente-servidor de sistemas web, qual
        afirmação está correta?
      </h2>
    </div>
    <div class="mainframe">
      <div class="options">
        <input type="radio" name="q5" id="q5a" class="wrong" />
        <label for="q5a" class="option">
          a) O cliente é responsável por armazenar e processar todos os dados da
          aplicação de forma permanente
        </label>

        <input type="radio" name="q5" id="q5b" class="wrong" />
        <label for="q5b" class="option">
          b) O servidor apenas exibe a interface, enquanto o cliente executa
          toda a lógica de negócio
        </label>

        <input type="radio" name="q5" id="q5c" class="correct" />
        <label for="q5c" class="option">
          c) O cliente faz requisições e o servidor processa, armazena dados e
          envia respostas, geralmente via protocolo HTTP
        </label>

        <input type="radio" name="q5" id="q5d" class="wrong" />
        <label for="q5d" class="option">
          d) Cliente e servidor precisam estar na mesma rede local para que o
          sistema web funcione
        </label>
      </div>
      <button class="nextbtn">
        <a href="obrigado.html">Proxima Questão</a>
      </button>
    </div>
  </body>
</html>
