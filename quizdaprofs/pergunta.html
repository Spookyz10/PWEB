<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pergunta 1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <h2 class="maintitle">1/4</h2>
    <div class="title">
      <h2 class="maintitle">
        O protocolo HTTP é classificado como um protocolo stateless (sem
        estado). Qual das opções a seguir descreve corretamente o impacto dessa
        caractersitica na arquitetura de sistemas web?
      </h2>
    </div>
    <div class="mainframe">
      <div class="options">
        <input type="radio" name="q1" id="q1a" class="wrong" />
        <label for="q1a" class="option">
          a) Cada resposta do servidor é armazenada automaticamente no cache
          local do navegador
        </label>

        <input type="radio" name="q1" id="q1b" class="correct" />
        <label for="q1b" class="option">
          b) Cada requisição é processada pelo servidor de forma indepente, sem
          historico nativo
        </label>

        <input type="radio" name="q1" id="q1c" class="wrong" />
        <label for="q1c" class="option">
          c) Cada requisição exige autenticação prévia do usuario no banco de
          dados do servidor
        </label>

        <input type="radio" name="q1" id="q1d" class="wrong" />
        <label for="q1d" class="option">
          d) Cada conexão permanece aberta continuamente entre client e servidor
          durante a sessão!
        </label>
      </div>
      <button class="nextbtn">
        <a href="pergunta2.html">proxima questão</a>
      </button>
    </div>
  </body>
</html>
