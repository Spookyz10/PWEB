    <meta charset="UTF-8" />

    <title>Pergunta 3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"

    <link href="style.css" rel="stylesheet" />

  <body>
    <h2 class="maintitle">3/4</h2>
    <div class="title">
      <h2 class="maintitle">
        O que significa a sigla URL no contexto de sistemas web?
      </h2>
    </div>
    <div class="mainframe">
      <div class="options">
        <input type="radio" name="q3" id="q3a" class="correct" />
        <label for="q3a" class="option">
          a) Uniform Resource Locator, o endereço usado pra localizar um recurso
          na web
        </label>

        <input type="radio" name="q3" id="q3b" class="wrong" />
        <label for="q3b" class="option">
          b) Universal Reference Link, um link de referencia universal entre
          servidores
        </label>

        <input type="radio" name="q3" id="q3c" class="wrong" />
        <label for="q3c" class="option">
          c) User Registered Login, o login registrado do usuario no sistema
        </label>

        <input type="radio" name="q3" id="q3d" class="wrong" />
        <label for="q3d" class="option">
          d) Unified Response Layer, a camada de resposta do servidor
        </label>
      </div>
      <button class="nextbtn">
        <a href="pergunta4.html">proxima questão</a>
      </button>
    </div>
  </body>
</html>
