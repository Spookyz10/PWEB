  <body>
    <h2 class="maintitle">2/5</h2>
    <div class="title">
      <h2 class="maintitle">
        Em uma arquitetura cliente-servidor, qual é a principal função do
        servidor web?
      </h2>
    </div>
    <div class="mainframe">
      <div class="options">
        <input type="radio" name="q2" id="q2a" class="wrong" />
        <label for="q2a" class="option">
          a) Renderizar o layout final da pagina no computador do usuario
        </label>

        <input type="radio" name="q2" id="q2b" class="correct" />
        <label for="q2b" class="option">
          b) Receber requisições dos clientes e retornar as respostas
          solicitadas
        </label>

        <input type="radio" name="q2" id="q2c" class="wrong" />
        <label for="q2c" class="option">
          c) Armazenar o historico de navegação do usuario localmente
        </label>

        <input type="radio" name="q2" id="q2d" class="wrong" />
        <label for="q2d" class="option">
          d) Executar o codigo JavaScript diretamente no navegador do cliente
        </label>
      </div>
      <button class="nextbtn">
        <a href="pergunta3.html">Proxima Questão</a>
      </button>
    </div>
