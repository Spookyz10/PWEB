    <meta charset="UTF-8" />

    <title>Pergunta 4</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"

    <link href="style.css" rel="stylesheet" />

  <body>
    <h2 class="maintitle">4/5</h2>
    <div class="title">
      <h2 class="maintitle">
        Qual a diferença basica entre os metodos HTTP GET e POST?
      </h2>
    </div>
    <div class="mainframe">
      <div class="options">
        <input type="radio" name="q4" id="q4a" class="wrong" />
        <label for="q4a" class="option">
          a) GET so funciona em servidores seguros e POST em qualquer servidor
        </label>

        <input type="radio" name="q4" id="q4b" class="wrong" />
        <label for="q4b" class="option">
          b) GET envia dados no corpo da requisição e POST na URL
        </label>

        <input type="radio" name="q4" id="q4c" class="correct" />
        <label for="q4c" class="option">
          c) GET busca dados e geralmente aparece na URL, POST envia dados no
          corpo da requisição
        </label>

        <input type="radio" name="q4" id="q4d" class="wrong" />
        <label for="q4d" class="option">
          d) Não existe diferença, os dois fazem exatamente a mesma coisa
        </label>
      </div>
      <button class="nextbtn">
        <a href="pergunta5.html">Proxima Questão</a>
      </button>
    </div>
  </body>
